<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">3D contribution graph placeholder</title>
  <desc id="desc">A themed placeholder shown until the GitHub Action generates the live 3D contribution graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061A2E"/>
      <stop offset="0.55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#F8FAFC" stroke-opacity=".10"/>
    </pattern>
  </defs>
  <rect width="900" height="260" rx="20" fill="url(#bg)"/>
  <rect width="900" height="260" rx="20" fill="url(#grid)"/>
  <g fill="#99F6E4" opacity=".72">
    <rect x="120" y="160" width="18" height="18" rx="3"/>
    <rect x="148" y="132" width="18" height="46" rx="3"/>
    <rect x="176" y="104" width="18" height="74" rx="3"/>
    <rect x="204" y="76" width="18" height="102" rx="3"/>
    <rect x="232" y="118" width="18" height="60" rx="3"/>
    <rect x="260" y="90" width="18" height="88" rx="3"/>
  </g>
  <text x="510" y="112" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="25" font-weight="700">3D Contribution Graph</text>
  <text x="510" y="148" text-anchor="middle" fill="#CCFBF1" font-family="Arial, sans-serif" font-size="16">Run the included GitHub Action to generate live data</text>
  <text x="510" y="176" text-anchor="middle" fill="#A5F3FC" font-family="Arial, sans-serif" font-size="14">运行 GitHub Action 后将自动替换为真实贡献图</text>
</svg>
